quarkus.http.port=8080

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:beneficiaries;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false

quarkus.log.level=INFO
quarkus.log.category."org.hibernate.SQL".level=WARN
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=OFF

quarkus.swagger-ui.always-include=true
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.write-dates-as-timestamps=false

# Cobertura de pruebas
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=true
%test.quarkus.jacoco.report-location=target/jacoco-report

quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper
